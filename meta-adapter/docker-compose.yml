version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: whatsapp-adapter-postgres
    environment:
      POSTGRES_DB: whatsapp_adapter
      POSTGRES_USER: whatsapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whatsapp_secure_password_change_me}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp -d whatsapp_adapter"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp-network
    restart: unless-stopped

  # Redis Cache & Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: whatsapp-adapter-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_password_change_me} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password_change_me}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - whatsapp-network
    restart: unless-stopped

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: whatsapp-adapter-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-whatsapp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_secure_password_change_me}
      RABBITMQ_DEFAULT_VHOST: whatsapp_adapter
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - whatsapp-network
    restart: unless-stopped

  # WhatsApp Meta API Adapter
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-adapter-app
    environment:
      # Server
      HOST: 0.0.0.0
      PORT: 8080

      # Database
      DATABASE_URL: postgresql://whatsapp:${POSTGRES_PASSWORD:-whatsapp_secure_password_change_me}@postgres:5432/whatsapp_adapter?sslmode=disable

      # Redis
      REDIS_URL: redis://default:${REDIS_PASSWORD:-redis_secure_password_change_me}@redis:6379/0

      # RabbitMQ
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-whatsapp}:${RABBITMQ_PASSWORD:-rabbitmq_secure_password_change_me}@rabbitmq:5672/whatsapp_adapter

      # JWT
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_this_should_be_very_long_and_random}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - whatsapp-network
    restart: unless-stopped
    # Security
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: false
    security_opt:
      - no-new-privileges:true

  # Webhook Delivery Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: whatsapp-adapter-worker
    environment:
      # Database
      DATABASE_URL: postgresql://whatsapp:${POSTGRES_PASSWORD:-whatsapp_secure_password_change_me}@postgres:5432/whatsapp_adapter?sslmode=disable

      # RabbitMQ
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-whatsapp}:${RABBITMQ_PASSWORD:-rabbitmq_secure_password_change_me}@rabbitmq:5672/whatsapp_adapter

      # Webhook
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change_me_in_production_webhook_secret_32_chars_min}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - whatsapp-network
    restart: unless-stopped
    # Security
    cap_drop:
      - ALL
    read_only: false
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  whatsapp-network:
    driver: bridge
